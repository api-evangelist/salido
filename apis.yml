name: Salido
description: SALIDO is a hospitality technology company providing a unified restaurant
  point-of-sale (POS) and payment processing platform for full-service, casual, upscale,
  and fine-dining operators. The system combines front-of-house and back-of-house
  operations, table and floor-plan management, menu and inventory tools, real-time
  analytics and multi-location reporting, and a mobile manager app, with an in-house
  payment processor (EPX). Originally a 500 Global / 500 Startups portfolio company,
  SALIDO was acquired by First Data and is now backed by North American Bancard (NAB).
  No public developer API or documentation surface is currently published.
